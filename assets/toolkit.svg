<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img" aria-labelledby="t d"><title id="t">Prince Kumar's technical toolkit</title><desc id="d">Verified technologies grouped into interface, systems, data and delivery.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070A10"/><stop offset="1" stop-color="#0D111B"/></linearGradient></defs><rect width="1100" height="310" rx="22" fill="url(#b)"/><rect x="1" y="1" width="1098" height="308" rx="21" fill="none" stroke="#273244"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><text x="42" y="47" fill="#F4F7FB" font-size="22" font-weight="700">A focused stack for complete products</text><text x="42" y="73" fill="#7F8A9E" font-size="13">Selected from public project manifests—not a catalog of every tool encountered.</text><g transform="translate(42 101)"><rect width="241" height="158" rx="16" fill="#0B1018" stroke="#253147"/><text x="20" y="31" fill="#8BD5FF" font-size="12" font-weight="700" letter-spacing="1.5">INTERFACE</text><text x="20" y="65" fill="#E6EAF0" font-size="16">TypeScript · JavaScript</text><text x="20" y="93" fill="#B6C0D0" font-size="15">React · Next.js</text><text x="20" y="121" fill="#B6C0D0" font-size="15">Tailwind CSS · Vite</text></g><g transform="translate(300 101)"><rect width="241" height="158" rx="16" fill="#0B1018" stroke="#253147"/><text x="20" y="31" fill="#59D499" font-size="12" font-weight="700" letter-spacing="1.5">SYSTEMS</text><text x="20" y="65" fill="#E6EAF0" font-size="16">Node.js · Express</text><text x="20" y="93" fill="#B6C0D0" font-size="15">REST APIs · Socket.IO</text><text x="20" y="121" fill="#B6C0D0" font-size="15">JWT · Auth0</text></g><g transform="translate(558 101)"><rect width="241" height="158" rx="16" fill="#0B1018" stroke="#253147"/><text x="20" y="31" fill="#C4A7FF" font-size="12" font-weight="700" letter-spacing="1.5">DATA + SERVICES</text><text x="20" y="65" fill="#E6EA