<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Prince Kumar — full-stack software engineer</title>
  <desc id="desc">A cinematic dark developer workspace with a floating laptop, terminal window, code panels, and subtle animated lighting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070B"/><stop offset=".5" stop-color="#0A0E16"/><stop offset="1" stop-color="#030407"/></linearGradient>
    <radialGradient id="blue" cx="0" cy="0" r="1" gradientTransform="translate(250 170) rotate(25) scale(500 310)"><stop stop-color="#1D8CFF" stop-opacity=".28"/><stop offset="1" stop-color="#1D8CFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet" cx="0" cy="0" r="1" gradientTransform="translate(1030 420) rotate(-135) scale(420 250)"><stop stop-color="#8B5CF6" stop-opacity=".23"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4B5563"/><stop offset=".4" stop-color="#151A23"/><stop offset="1" stop-color="#06080D"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C121D"/><stop offset="1" stop-color="#05070B"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".7"/></filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#8BD5FF" stroke-opacity=".06"/></pattern>
    <clipPath id="screenClip"><rect x="688" y="80" width="396" height="272" rx="13"/></clipPath>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="28" fill="url(#blue)"/>
  <rect width="1200" height="520" rx="28" fill="url(#violet)"/>
  <path d="M0 390C260 315 445 338 660 388s350 76 540 8v124H0Z" fill="url(#grid)" opacity=".7"/>
  <ellipse cx="910" cy="410" rx="255" ry="54" fill="#178CFF" opacity=".11" filter="url(#blur)"><animate attributeName="opacity" values=".08;.2;.08" dur="5s" repeatCount="indefinite"/></ellipse>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(70 76)">
      <rect width="116" height="28" rx="14" fill="#111827" stroke="#273244"/>
      <circle cx="17" cy="14" r="4" fill="#59D499"><animate attributeName="opacity" values="1;.35;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <text x="30" y="19" fill="#B8C2D6" font-size="12" font-weight="600" letter-spacing="1.4">AVAILABLE</text>
      <text y="82" fill="#F5F7FA" font-size="57" font-weight="720" letter-spacing="-2.5">Prince Kumar</text>
      <text y="125" fill="#8BD5FF" font-size="23" font-weight="560" letter-spacing=".4">FULL-STACK SOFTWARE ENGINEER</text>
      <text y="182" fill="#AAB4C7" font-size="18">I design clean interfaces and engineer the systems</text>
      <text y="210" fill="#AAB4C7" font-size="18">behind real-time, AI-assisted web products.</text>
      <g transform="translate(0 252)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">
        <rect width="484" height="116" rx="15" fill="#090D14" fill-opacity=".9" stroke="#263041"/>
        <circle cx="19" cy="18" r="4" fill="#FF5F57"/><circle cx="34" cy="18" r="4" fill="#FEBB2E"/><circle cx="49" cy="18" r="4" fill="#28C840"/>
        <text x="18" y="53" fill="#667085">prince@workspace ~ %</text>
        <text x="194" y="53" fill="#E5E7EB">build --from-idea</text>
        <text x="18" y="80" fill="#8BD5FF">✓ interface</text><text x="131" y="80" fill="#A78BFA">✓ api</text><text x="210" y="80" fill="#59D499">✓ data</text>
        <text x="18" y="103" fill="#667085">shipping thoughtful software</text>
        <rect x="260" y="91" width="8" height="14" rx="1" fill="#8BD5FF"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
      </g>
    </g>
    <g filter="url(#shadow)" transform="rotate(-1.8 890 250)">
      <rect x="670" y="61" width="432" height="310" rx="22" fill="url(#metal)" stroke="#708198" stroke-opacity=".5"/>
      <rect x="688" y="80" width="396" height="272" rx="13" fill="url(#screen)"/>
      <g clip-path="url(#screenClip)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
        <rect x="688" y="80" width="396" height="31" fill="#111722"/>
        <circle cx="707" cy="95" r="4" fill="#FF5F57"/><circle cx="721" cy="95" r="4" fill="#FEBB2E"/><circle cx="735" cy="95" r="4" fill="#28C840"/>
        <text x="753" y="100" fill="#718096" font-size="10">product-engineering.ts</text>
        <text x="711" y="140" fill="#718096" font-size="12">01</text><text x="742" y="140" fill="#C792EA">const</text><text x="780" y="140" fill="#D6DEEB"> engineer = {</text>
        <text x="711" y="168" fill="#718096" font-size="12">02</text><text x="760" y="168" fill="#82AAFF">craft:</text><text x="820" y="168" fill="#ECC48D"> 'product UI'</text><text x="926" y="168" fill="#D6DEEB">,</text>
        <text x="711" y="196" fill="#718096" font-size="12">03</text><text x="760" y="196" fill="#82AAFF">systems:</text><text x="836" y="196" fill="#ECC48D"> 'APIs + data'</text><text x="957" y="196" fill="#D6DEEB">,</text>
        <text x="711" y="224" fill="#718096" font-size="12">04</text><text x="760" y="224" fill="#82AAFF">signal:</text><text x="827" y="224" fill="#ECC48D"> 'real-time'</text><text x="927" y="224" fill="#D6DEEB">,</text>
        <text x="711" y="252" fill="#718096" font-size="12">05</text><text x="760" y="252" fill="#82AAFF">method:</text><text x="827" y="252" fill="#ECC48D"> 'ship + learn'</text>
        <text x="711" y="280" fill="#718096" font-size="12">06</text><text x="742" y="280" fill="#D6DEEB">};</text>
        <path d="M700 319H1068" stroke="#263041"/>
        <text x="711" y="338" fill="#59D499" font-size="11">● system ready</text>
        <g opacity=".35"><path d="M1060 120v158" stroke="#8BD5FF" stroke-width="2"><animate attributeName="d" values="M1060 120v158;M1060 156v122;M1060 120v158" dur="4s" repeatCount="indefinite"/></path></g>
      </g>
      <path d="M638 371h496l47 46c5 5 1 14-7 14H602c-8 0-12-9-7-14Z" fill="url(#metal)" stroke="#556274" stroke-opacity=".5"/>
      <path d="M812 377h151l18 22H794Z" fill="#090C12" stroke="#384252"/>
      <path d="M620 431h540" stroke="#A7B1C2" stroke-opacity=".55" stroke-width="2"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="519" rx="27.5" fill="none" stroke="#303846"/>
</svg>
