    <g transform="translate(332 82)"><rect width="202" height="138" rx="18" fill="#141820" stroke="#49637F"/><circle cx="101" cy="25" r="5" fill="#69D3A7"/><text x="101" y="52" fill="#8B96A6" font-size="11" letter-spacing="1.5">APPLICATION</text><text x="101" y="82" fill="#E8EDF4" font-size="18" font-weight="650">Express API</text><text x="101" y="107" fill="#A7B1C0" font-size="12">auth · uploads · Socket.IO</text></g>
    <g transform="translate(612 83)"><rect width="200" height="135" rx="17" fill="#141820" stroke="#303A49"/><text x="100" y="39" fill="#8B96A6" font-size="11" letter-spacing="1.5">DATA ACCESS</text><text x="100" y="70" fill="#E8EDF4" font-size="18" font-weight="650">Drizzle ORM</text><text x="100" y="96" fill="#A7B1C0" font-size="12">service boundaries</text></g>
    <g transform="translate(888 55)"><rect width="250" height="96" rx="15" fill="#141820" stroke="#303A49"/><text x="125" y="38" fill="#E8EDF4" font-size="17" font-weight="650">PostgreSQL + MongoDB</text><text x="125" y="65" fill="#A7B1C0" font-size="12">relational + document storage</text></g>
