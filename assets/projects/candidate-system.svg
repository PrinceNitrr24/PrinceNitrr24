    <text x="54" y="265" fill="#7E8998" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" text-anchor="start">PUBLIC REPOSITORY NOTE · AUTH + ORGANIZATION SCOPING HARDENING IS STILL IN PROGRESS</text>
