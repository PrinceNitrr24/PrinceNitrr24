<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Candidate.live system map</title>
  <desc id="desc">A Next.js dashboard connects to Express and Socket.IO services, backed by MongoDB, PostgreSQL through Drizzle, and ingestion and search workers.</desc>
