    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#090B0F"/><stop offset="1" stop-color="#10141B"/></linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l8 4-8 4Z" fill="#76AFFF"/></marker>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="21" fill="none" stroke="#222936"/>
  <g fill="none" stroke="#475364" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M246 151h86"/><path d="M534 151h78"/><path d="M812 118h76"/><path d="M812 184h76"/><path d="M534 190c54 0 56 65 122 65h144"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
