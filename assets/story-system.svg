<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">StoryToVoice system path</title><desc id="desc">Story input passes through a Next.js interface and Express API to MongoDB and text-to-speech services, producing playable audio.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#080A0E"/><stop offset="1" stop-color="#0B0E13"/></linearGradient><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l8 4-8 4Z" fill="#8BD5FF"/></marker></defs>
  <rect width="1200" height="260" rx="20" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="258" rx="19" fill="none" stroke="#242A33"/>
  <g fill="none" stroke="#8BD5FF" stroke-width="1.5" stroke-opacity=".7" marker-end="url(#arrow)"><path d="M222 130h81"/><path d="M472 130h79"/><path d="M720 130h70"/><path d="M945 130h68"/></g>
  <path d="M223 130h789" fill="none" stroke="#D8F2FF" stroke-width="2" stroke-dasharray="4 18" opacity=".65"><animate attributeName="stroke-dashoffset" values="44;0" dur="4s" repeatCount="indefinite"/></path>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <g transform="translate(55 72)"><rect width="168" height="116" rx="14" fill="#10141A" stroke="#303844"/><text x="84" y="44" fill="#7E8998" font-size="11" letter-spacing="1.4">INPUT</text><text x="84" y="74" fill="#F1F4F7" font-size="17" font-weight="650">Story + cover</text><text x="84" y="95" fill="#7E8998" font-size="11">title · content · image</text></g>
    <g transform="translate(304 72)"><rect width="168" height="116" rx="14" fill="#10141A" stroke="#303844"/><text x="84" y="44" fill="#7E8998" font-size="11" letter-spacing="1.4">INTERFACE</text><text x="84" y="74" fill="#F1F4F7" font-size="17" font-weight="650">Next.js 14</text><text x="84" y="95" fill="#7E8998" font-size="11">create · browse · play</text></g>
    <g transform="translate(552 72)"><rect width="168" height="116" rx="14" fill="#10141A" stroke="#3A5161"/><circle cx="84" cy="25" r="4" fill="#69D3A7"><animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/></circle><text x="84" y="44" fill="#7E8998" font-size="11" letter-spacing="1.4">SERVICE</text><text x="84" y="74" fill="#F1F4F7" font-size="17" font-weight="650">Express API</text><text x="84" y="95" fill="#7E8998" font-size="11">stories · audio jobs</text></g>
    <g transform="translate(790 72)"><rect width="156" height="116" rx="14" fill="#10141A" stroke="#303844"/><text x="78" y="44" fill="#7E8998" font-size="11" letter-spacing="1.4">DATA</text><text x="78" y="74" fill="#F1F4F7" font-size="17" font-weight="650">MongoDB</text><text x="78" y="95" fill="#7E8998" font-size="11">story records</text></g>
    <g transform="translate(1014 72)"><rect width="132" height="116" rx="14" fill="#10141A" stroke="#303844"/><text x="66" y="44" fill="#7E8998" font-size="11" letter-spacing="1.4">OUTPUT</text><text x="66" y="74" fill="#F1F4F7" font-size="17" font-weight="650">Narration</text><text x="66" y="95" fill="#7E8998" font-size="11">TTS → audio</text></g>
  </g>
</svg>
